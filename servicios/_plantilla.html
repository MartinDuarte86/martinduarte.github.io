<!DOCTYPE html>
<!--
  PLANTILLA DE REFERENCIA — página de pilar. NO se publica (empieza con _).
  Copiar este archivo a servicios/<slug>/index.html y completar:
   1. <title> / <meta description> / canonical / og:* propios del pilar.
   2. body data-pilar="<slug>" (marca el activo en el dropdown del nav).
   3. Breadcrumb, hero, TÍTULO del pilar arriba de los servicios, tarjetas de
      servicio con FAQ desplegable dentro (patrón <details> anidado), casos
      propios del pilar y UN único cierre de contacto.
   4. La llamada a MDSite.injectSchema({...}) al final, con Service + Breadcrumb
      + FAQPage (las preguntas del schema deben coincidir con las visibles).
  Todo lo compartido (nav, footer, WhatsApp, modal, analítica) lo inyectan
  site.js y booking.js — esta página solo aporta contenido y estilos de marca.
-->
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{Título del pilar}} | Martín Duarte</title>
    <meta name="description" content="{{Descripción del pilar (150-160 car.)}}">
    <meta name="author" content="Martín Duarte">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#0F172A">
    <link rel="canonical" href="https://martinduarte.com/servicios/{{slug}}/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Martín Duarte">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="{{Título del pilar}} | Martín Duarte">
    <meta property="og:description" content="{{Descripción del pilar}}">
    <meta property="og:url" content="https://martinduarte.com/servicios/{{slug}}/">
    <meta property="og:image" content="https://martinduarte.com/assets/img/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google AdSense (restricción de marca: en el <head> de TODAS las páginas) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1594572872514423" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --primary:#0F172A; --brand:#2563EB; --bg-light:#F8FAFC; --line:rgba(226,232,240,0.9); --teal:#0F6E56; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg-light); color:var(--primary); }
        h1,h2,h3,h4,.font-heading { font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em; }
        .bento-card { position:relative; background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.7)); border:1px solid var(--line); border-radius:2.5rem; transition:all .5s cubic-bezier(.2,.8,.2,1); }
        .sub-card { border-radius:2rem; border:1px solid var(--line); overflow:hidden; transition:all .35s ease; background:#fff; display:flex; flex-direction:column; }
        .sub-card:hover { box-shadow:0 30px 60px -25px rgba(15,23,42,.15); }
        details summary { list-style:none; cursor:pointer; }
        details summary::-webkit-details-marker { display:none; }
        details[open] > summary .chev { transform:rotate(180deg); }
        .chev { transition:transform .25s ease; }
        .pill { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
    </style>
</head>
<body class="antialiased" data-pilar="{{slug}}">

    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-[100] focus:top-4 focus:left-4 focus:bg-slate-900 focus:text-white focus:px-4 focus:py-2 focus:rounded-full text-sm font-bold">Saltar al contenido</a>

    <div id="site-nav"></div>
    <div id="site-whatsapp"></div>

    <main id="main">
        <!-- Breadcrumb + volver | Hero del pilar | Título del pilar + tarjetas de
             servicio con FAQ | Casos propios | Único cierre de contacto -->
    </main>

    <div id="site-footer"></div>
    <div id="site-booking"></div>

    <script src="/assets/js/site.js" defer></script>
    <script src="/assets/js/booking.js" defer></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        MDSite.injectSchema({
          tipo: 'Service',
          nombre: '{{Título del pilar}}',
          descripcion: '{{Descripción del pilar}}',
          url: 'https://martinduarte.com/servicios/{{slug}}/',
          audience: ['{{Público 1}}', '{{Público 2}}'],
          breadcrumb: [
            { name: 'Inicio', url: 'https://martinduarte.com/' },
            { name: 'Servicios', url: 'https://martinduarte.com/#servicios' },
            { name: '{{Título del pilar}}', url: 'https://martinduarte.com/servicios/{{slug}}/' }
          ],
          faqs: [ /* { q: '¿…?', a: '…' }  — todas las visibles de la página */ ]
        });
      });
    </script>
</body>
</html>
